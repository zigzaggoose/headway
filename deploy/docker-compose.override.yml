# Local only. make up layers this over docker-compose.yml.
services:
  postgres:
    # 5433, not 5432: the dev database from README.md already has 5432.
    ports:
      - "5433:5432"
  transitlateagain:
    # The VM has no public port (it is reached through the tunnel); locally the
    # API is on 8080 as usual. Compose appends this to the base file's ports.
    ports:
      - "8080:8080"
    environment:
      LOG_FORMAT: text
