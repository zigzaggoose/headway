# The VM only, layered over docker-compose.yml on every command there
# (deploy/vm-bootstrap.md).

services:
  transitlateagain:
    # https://transitlateagain.dev is proxied by Cloudflare, which connects to
    # 443 in Full (strict) mode, so the service presents Cloudflare's origin
    # certificate. deploy/firewall.sh admits only Cloudflare's ranges, which is
    # what makes CF-Connecting-IP safe to key the rate limit on (§15).
    ports:
      - "443:8080"
    volumes:
      # Outside the checkout, so git pull never touches the key. The key is
      # owned by 65532, the image's nonroot user, mode 0400.
      - /opt/transitlateagain-tls:/tls:ro
    environment:
      HTTP_TLS_CERT_FILE: /tls/origin.pem
      HTTP_TLS_KEY_FILE: /tls/origin.key
      HTTP_CLIENT_IP_HEADER: CF-Connecting-IP

  alloy:
    # Pushes /metrics to Grafana Cloud (deploy/alloy.config). The admin port it
    # scrapes is on the Compose network, never public.
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy.config:/etc/alloy/config.alloy:ro
    environment:
      GRAFANA_REMOTE_WRITE_URL: ${GRAFANA_REMOTE_WRITE_URL:?set GRAFANA_REMOTE_WRITE_URL in .env}
      GRAFANA_USERNAME: ${GRAFANA_USERNAME:?set GRAFANA_USERNAME in .env}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN:?set GRAFANA_TOKEN in .env}
      # The VM has ~220 MB free; one scrape target needs far less than Go's
      # default heap growth would take.
      GOMEMLIMIT: 96MiB
    depends_on:
      - transitlateagain
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
