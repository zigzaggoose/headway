# Production and local: postgres + transitlateagain. Run from the repository root with
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
# (make up adds the local override). On the VM the repository is cloned to
# /opt/transitlateagain, so ../.env below is /opt/transitlateagain/.env (§8.2).

name: transitlateagain

x-logging: &logging
  # The VM has a 20 GB disk. Unrotated container logs are the easiest way to
  # fill it without the database noticing.
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    # 18.6. The digest pins the exact image; bump both together.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: headway
      POSTGRES_DB: headway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # 128MB fits beside the service on the 1 GB VM (§16 q6).
    command: ["postgres", "-c", "shared_buffers=128MB"]
    volumes:
      # From 18 the image keeps its data under a versioned subdirectory of
      # /var/lib/postgresql, and expects the volume mounted there.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "headway", "-d", "headway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  transitlateagain:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: transitlateagain:local
    env_file: ../.env
    environment:
      # Overrides the laptop's localhost URL from .env: inside Compose the
      # database is the postgres service.
      DATABASE_URL: postgres://headway:${POSTGRES_PASSWORD}@postgres:5432/headway?sslmode=disable
      # All interfaces inside the container; the port binding below is what
      # keeps it off the internet.
      ADMIN_ADDR: ":8081"
    depends_on:
      postgres:
        condition: service_healthy
    # No public port: on the VM the only way in is the Cloudflare Tunnel below,
    # over the Compose network. The local override publishes 8080 for make up.
    ports:
      # Host loopback only: reach it with ssh, never from outside (§7).
      - "127.0.0.1:8081:8081"
    # Shutdown drains HTTP for up to HTTP_SHUTDOWN_GRACE and then the writer
    # for up to the same again (§9.4). Docker's default of 10s would SIGKILL
    # mid-flush and lose the final batch.
    stop_grace_period: 45s
    restart: unless-stopped
    logging: *logging
    # No healthcheck: the image has no shell or HTTP client to run one, and
    # Compose does not restart an unhealthy container anyway. /healthz is for
    # whatever watches from outside.

  # The two below run only where COMPOSE_PROFILES=vm, which the VM's .env sets.

  cloudflared:
    # Cloudflare Tunnel: an outbound connection that carries transitlateagain.dev
    # to transitlateagain:8080, so the VM publishes no public port (§15). The
    # hostname-to-service mapping lives in the Cloudflare dashboard.
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - transitlateagain
    profiles: ["vm"]
    restart: unless-stopped
    logging: *logging

  alloy:
    # Pushes /metrics to Grafana Cloud (deploy/alloy.config).
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy.config:/etc/alloy/config.alloy:ro
    environment:
      GRAFANA_REMOTE_WRITE_URL: ${GRAFANA_REMOTE_WRITE_URL:-}
      GRAFANA_USERNAME: ${GRAFANA_USERNAME:-}
      GRAFANA_TOKEN: ${GRAFANA_TOKEN:-}
      # The VM has ~220 MB free; one scrape target needs far less than Go's
      # default heap growth would take.
      GOMEMLIMIT: 96MiB
    depends_on:
      - transitlateagain
    profiles: ["vm"]
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
    # The project was called headway until 2026-09-24, and Compose names
    # volumes after the project. Pinning the name keeps the VM's data across
    # the rename; without it, the renamed project would start on an empty one.
    name: headway_pgdata
